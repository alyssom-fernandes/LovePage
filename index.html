<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nosso Amor Infinito • High-End Player</title>

    <!-- Google Fonts Luxury Kit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        /* ==========================================================================
           1. VARIÁVEIS & ESTILOS BASE (TEMA VINHO LUXO & OURO NOBRE)
           ========================================================================== */
        :root {
            --bg-wine-dark: #0a0104;
            --wine-primary: #330511;
            --wine-accent: #52091c;
            --gold-light: #f8e29a;
            --gold-primary: #d4af37;
            --gold-dark: #a37f19;
            --gold-gradient: linear-gradient(135deg, #fceabb 0%, #d4af37 50%, #9c7816 100%);
            --glass-wine: rgba(30, 3, 10, 0.72);
            --glass-border: rgba(212, 175, 55, 0.28);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        html, body {
            height: 100dvh;
            max-height: 100dvh;
            overflow: hidden; /* Trava rolagem vertical */
            background-color: var(--bg-wine-dark);
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Canvas de Fundo */
        #bg-canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Luz Ambiente de Fundo */
        .ambient-bg {
            position: fixed;
            inset: -10%;
            width: 120%;
            height: 120%;
            background: radial-gradient(circle at center, #480718 0%, #1c0208 65%, #080103 100%);
            z-index: 0;
            animation: ambientPulse 8s ease-in-out infinite alternate;
        }

        @keyframes ambientPulse {
            0% { opacity: 0.8; transform: scale(1); filter: blur(25px); }
            100% { opacity: 1; transform: scale(1.05); filter: blur(35px); }
        }

        .shimmer-text {
            background: linear-gradient(90deg, #d4af37 0%, #ffffff 50%, #d4af37 100%);
            background-size: 200% auto;
            color: #000;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 5s linear infinite;
        }

        @keyframes shine {
            to { background-position: 200% center; }
        }

        /* ==========================================================================
           2. SPLASH SCREEN (TELA DE ENTRADA)
           ========================================================================== */
        .splash-screen {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 50px 24px 40px 24px;
            background: radial-gradient(circle at center, #2e040e 0%, #0c0103 100%);
            transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.8s, transform 0.8s;
        }

        .splash-screen.fade-out {
            opacity: 0;
            visibility: hidden;
            transform: scale(1.05);
        }

        .splash-top-icon {
            color: var(--gold-primary);
            opacity: 0.85;
            margin-top: 10px;
            filter: drop-shadow(0 0 10px rgba(212, 175, 55, 0.4));
        }

        .splash-title {
            font-family: 'Cinzel', serif;
            font-size: 1.8rem;
            font-weight: 600;
            letter-spacing: 2px;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            line-height: 1.4;
        }

        .btn-start {
            width: 135px;
            height: 135px;
            border-radius: 50%;
            background: radial-gradient(circle, #450817 0%, #1c0208 100%);
            border: 2px solid var(--gold-primary);
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.35), inset 0 0 15px rgba(0, 0, 0, 0.8);
            color: var(--gold-light);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
        }

        .btn-start::before {
            content: '';
            position: absolute;
            inset: -8px;
            border-radius: 50%;
            border: 1px solid rgba(212, 175, 55, 0.3);
            animation: ringPulse 2.2s infinite;
        }

        @keyframes ringPulse {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.18); opacity: 0; }
        }

        .btn-start:active { transform: scale(0.93); }

        .btn-start-text {
            font-family: 'Cinzel', serif;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            color: var(--gold-light);
        }

        .splash-footer {
            text-align: center;
            font-size: 0.78rem;
            color: rgba(248, 226, 154, 0.6);
            letter-spacing: 0.5px;
            font-weight: 300;
        }

        /* ==========================================================================
           3. INTERFACE PRINCIPAL DO PLAYER (OTIMIZADA PARA TELA ÚNICA)
           ========================================================================== */
        .app-container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 420px;
            height: 100dvh;
            max-height: 100dvh;
            padding: 16px 18px 18px 18px;
            display: flex;
            flex-direction: column;
            justify-content: space-between; /* Distribuição vertical perfeita */
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.8s ease 0.2s, transform 0.8s ease 0.2s;
        }

        .app-container.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* Moldura Dupla da Foto (Tamanho Proporcional Inteligente) */
        .album-art-wrapper {
            position: relative;
            width: clamp(160px, 23vh, 200px);
            height: clamp(160px, 23vh, 200px);
            margin: 0 auto;
        }

        .album-frame-back {
            position: absolute;
            inset: -6px;
            border-radius: 22px;
            background: rgba(82, 9, 28, 0.35);
            border: 1px solid rgba(212, 175, 55, 0.25);
            backdrop-filter: blur(10px);
            transform: rotate(-3deg);
        }

        .album-art-container {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 18px;
            overflow: hidden;
            border: 1.5px solid rgba(212, 175, 55, 0.5);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.8), 0 0 20px rgba(82, 9, 28, 0.6);
            cursor: pointer;
        }

        .album-art {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s ease;
        }

        .album-art-container.playing .album-art {
            animation: breatheArt 4s ease-in-out infinite alternate;
        }

        @keyframes breatheArt {
            0% { transform: scale(1); }
            100% { transform: scale(1.04); }
        }

        /* Equalizador Frequencial */
        .equalizer-bars {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 4px;
            height: 14px;
            margin-top: -2px;
        }

        .equalizer-bars .bar {
            width: 3px;
            height: 4px;
            background: var(--gold-primary);
            border-radius: 2px;
            transition: height 0.3s ease;
        }

        .equalizer-bars.playing .bar {
            animation: barDance 0.8s ease-in-out infinite alternate;
        }

        .equalizer-bars.playing .bar:nth-child(1) { animation-delay: 0.1s; }
        .equalizer-bars.playing .bar:nth-child(2) { animation-delay: 0.35s; }
        .equalizer-bars.playing .bar:nth-child(3) { animation-delay: 0.2s; }
        .equalizer-bars.playing .bar:nth-child(4) { animation-delay: 0.5s; }
        .equalizer-bars.playing .bar:nth-child(5) { animation-delay: 0.25s; }

        @keyframes barDance {
            0% { height: 3px; opacity: 0.4; }
            100% { height: 14px; opacity: 1; box-shadow: 0 0 8px var(--gold-primary); }
        }

        /* Detalhes da Música */
        .track-info {
            text-align: center;
        }

        .track-title {
            font-family: 'Cinzel', serif;
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .track-subtitle {
            font-size: 0.78rem;
            color: rgba(248, 226, 154, 0.7);
            margin-top: 2px;
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        /* Controles de Áudio Compactos */
        .audio-controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 0 4px;
        }

        .progress-wrapper {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .progress-bar {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 4px;
            border-radius: 2px;
            background: rgba(212, 175, 55, 0.2);
            outline: none;
            cursor: pointer;
            overflow: hidden;
        }

        .progress-bar::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 10px; height: 10px;
            border-radius: 50%;
            background: var(--gold-primary);
            box-shadow: -400px 0 0 395px var(--gold-primary);
        }

        .time-stamps {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            color: rgba(248, 226, 154, 0.65);
            font-weight: 500;
        }

        .buttons-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 8px;
        }

        .control-btn {
            background: none;
            border: none;
            color: var(--gold-light);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s ease;
            opacity: 0.85;
        }

        .control-btn:active {
            transform: scale(0.86);
            opacity: 1;
        }

        .control-btn.active-repeat {
            color: #ffffff;
            filter: drop-shadow(0 0 6px var(--gold-primary));
        }

        .btn-play-main {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: radial-gradient(circle, #480718 0%, #1c0208 100%);
            border: 2px solid var(--gold-primary);
            color: var(--gold-primary);
            box-shadow: 0 0 16px rgba(212, 175, 55, 0.35);
            opacity: 1;
        }

        .btn-like svg {
            width: 20px; height: 20px;
            fill: none;
            stroke: var(--gold-light);
            stroke-width: 2;
            transition: all 0.3s ease;
        }

        .btn-like.liked svg {
            fill: var(--gold-primary);
            stroke: var(--gold-primary);
            transform: scale(1.15);
            filter: drop-shadow(0 0 8px rgba(212, 175, 55, 0.6));
        }

        /* Controle Deslizante de Volume */
        .volume-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 0 30px;
        }

        .volume-icon {
            color: rgba(248, 226, 154, 0.6);
            display: flex;
            align-items: center;
        }

        .volume-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 3px;
            border-radius: 2px;
            background: rgba(212, 175, 55, 0.2);
            outline: none;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 8px; height: 8px;
            border-radius: 50%;
            background: var(--gold-primary);
            cursor: pointer;
        }

        /* ==========================================================================
           4. SEÇÃO DE LETRAS COMPACTA (APPLE MUSIC STYLE)
           ========================================================================== */
        .lyrics-section {
            background: var(--glass-wine);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 16px;
            padding: 10px 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }

        .lyrics-container {
            max-height: 72px; /* Mostra ~2 frases focadas no centro */
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            text-align: center;
            padding: 0 4px;
            scroll-behavior: smooth;
        }

        .lyrics-container::-webkit-scrollbar { display: none; }

        .lyric-line {
            font-family: 'Cormorant Garamond', serif;
            font-size: 0.98rem;
            color: rgba(248, 226, 154, 0.4);
            transition: all 0.35s ease;
            font-style: italic;
            cursor: pointer;
            padding: 1px 0;
            line-height: 1.3;
        }

        .lyric-line:hover { color: rgba(255, 255, 255, 0.85); }

        .lyric-line.active {
            color: #ffffff;
            font-size: 1.08rem;
            font-weight: 600;
            font-style: normal;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.7);
            transform: scale(1.02);
        }

        /* ==========================================================================
           5. CONTADOR DE RELACIONAMENTO (RODAPÉ COMPACTO)
           ========================================================================== */
        .counter-pill {
            background: var(--glass-wine);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 28px;
            padding: 10px 14px;
            text-align: center;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }

        .counter-header {
            display: flex;
            align-items: center;
            gap: 5px;
            font-family: 'Cinzel', serif;
            font-size: 0.72rem;
            color: var(--gold-light);
            letter-spacing: 1px;
        }

        .counter-highlight {
            color: #ffffff;
            font-weight: 700;
            font-size: 0.8rem;
            text-shadow: 0 0 8px rgba(212, 175, 55, 0.5);
            letter-spacing: 0.5px;
        }

        .counter-subtime {
            font-size: 0.68rem;
            color: rgba(248, 226, 154, 0.65);
            font-weight: 300;
        }

        /* Partícula SVG ao curtir */
        .heart-burst-particle {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            animation: burstAnimation 1s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
        }

        @keyframes burstAnimation {
            0% { opacity: 1; transform: translate(-50%, -50%) scale(0.3); }
            100% { opacity: 0; transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(1.3); }
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- Canvas de Fundo -->
    <canvas id="bg-canvas"></canvas>

    <!-- Fundo Iluminado Ambiente -->
    <div class="ambient-bg"></div>

    <!-- Áudio HTML5 -->
    <audio id="audio-player" preload="metadata"></audio>

    <!-- 1. TELA DE ENTRADA / SPLASH SCREEN -->
    <div id="splash-screen" class="splash-screen">
        <div class="splash-top-icon">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 18V5l12-2v13"></path>
                <circle cx="6" cy="18" r="3"></circle>
                <circle cx="18" cy="16" r="3"></circle>
            </svg>
        </div>

        <h1 class="splash-title">Uma surpresa<br>para você...</h1>

        <button id="btn-start" class="btn-start">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" style="margin-left: 3px;">
                <path d="M8 5v14l11-7z"/>
            </svg>
            <span class="btn-start-text">APERTE O PLAY</span>
        </button>

        <div class="splash-footer">
            Sua história começa aqui.<br>Toque para entrar.
        </div>
    </div>

    <!-- 2. INTERFACE PRINCIPAL DO PLAYER -->
    <main id="app-container" class="app-container">

        <!-- Capa da Foto -->
        <div class="album-art-wrapper">
            <div class="album-frame-back"></div>
            <div id="album-container" class="album-art-container" title="Toque duas vezes para curtir">
                <img id="album-art" src="" alt="Foto do Casal" class="album-art">
            </div>
        </div>

        <!-- Equalizador Frequencial -->
        <div id="equalizer" class="equalizer-bars">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </div>

        <!-- Informações da Música -->
        <div class="track-info">
            <h2 class="track-title shimmer-text">Na Hora Que Você Me Chamar</h2>
            <p class="track-subtitle">Jorge & Mateus • Você & Eu</p>
        </div>

        <!-- Controles de Áudio -->
        <div class="audio-controls">
            <div class="progress-wrapper">
                <input type="range" id="progress-bar" class="progress-bar" min="0" max="100" value="0">
                <div class="time-stamps">
                    <span id="current-time">00:00</span>
                    <span id="duration-time">00:00</span>
                </div>
            </div>

            <div class="buttons-row">
                <!-- Repetir -->
                <button id="btn-repeat" class="control-btn" aria-label="Repetir">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="17 1 21 5 17 9"></polyline>
                        <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
                        <polyline points="7 23 3 19 7 15"></polyline>
                        <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
                    </svg>
                </button>

                <!-- Anterior -->
                <button id="btn-prev" class="control-btn" aria-label="Voltar">
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
                        <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/>
                    </svg>
                </button>

                <!-- Play/Pause -->
                <button id="btn-toggle-play" class="control-btn btn-play-main" aria-label="Tocar/Pausar">
                    <svg id="icon-play" viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                        <path d="M8 5v14l11-7z"/>
                    </svg>
                    <svg id="icon-pause" class="hidden" viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                        <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                    </svg>
                </button>

                <!-- Próximo -->
                <button id="btn-next" class="control-btn" aria-label="Avançar">
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
                        <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
                    </svg>
                </button>

                <!-- Curtir -->
                <button id="btn-like" class="control-btn btn-like" aria-label="Curtir">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                    </svg>
                </button>
            </div>

            <!-- Volume -->
            <div class="volume-container">
                <span class="volume-icon">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                    </svg>
                </span>
                <input type="range" id="volume-slider" class="volume-slider" min="0" max="1" step="0.05" value="1">
                <span class="volume-icon">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                        <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                    </svg>
                </span>
            </div>
        </div>

        <!-- 3. LETRAS DA MÚSICA -->
        <div class="lyrics-section">
            <div id="lyrics-container" class="lyrics-container">
                <!-- Gerado via JS -->
            </div>
        </div>

        <!-- 4. CONTADOR DE RELACIONAMENTO -->
        <div class="counter-pill">
            <div class="counter-header">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <polyline points="12 6 12 12 16 14"></polyline>
                </svg>
                <span>JUNTOS HÁ</span>
            </div>
            <div class="counter-highlight" id="counter-main">0 ANOS • 0 MESES • 0 DIAS</div>
            <div id="counter-sub" class="counter-subtime">00 HORAS • 00 MIN • 00 SEG</div>
        </div>

    </main>

    <!-- ==========================================================================
       LÓGICA JAVASCRIPT REFINADA
       ========================================================================== -->
