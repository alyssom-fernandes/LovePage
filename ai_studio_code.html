<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nosso Amor Infinito • High-End Player</title>

    <!-- Google Fonts Luxury Kit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        /* ==========================================================================
           1. VARIÁVEIS & ESTILOS BASE (TEMA VINHO LUXO & OURO NOBRE)
           ========================================================================== */
        :root {
            --bg-wine-dark: #0a0104;
            --wine-primary: #330511;
            --wine-accent: #52091c;
            --gold-light: #f8e29a;
            --gold-primary: #d4af37;
            --gold-dark: #a37f19;
            --gold-gradient: linear-gradient(135deg, #fceabb 0%, #d4af37 50%, #9c7816 100%);
            --glass-wine: rgba(30, 3, 10, 0.72);
            --glass-border: rgba(212, 175, 55, 0.28);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background-color: var(--bg-wine-dark);
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            overflow-x: hidden;
            position: relative;
        }

        /* Canvas de Fundo */
        #bg-canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Luz Ambiente de Fundo */
        .ambient-bg {
            position: fixed;
            inset: -10%;
            width: 120%;
            height: 120%;
            background: radial-gradient(circle at center, #480718 0%, #1c0208 65%, #080103 100%);
            z-index: 0;
            animation: ambientPulse 8s ease-in-out infinite alternate;
        }

        @keyframes ambientPulse {
            0% { opacity: 0.8; transform: scale(1); filter: blur(25px); }
            100% { opacity: 1; transform: scale(1.05); filter: blur(35px); }
        }

        .shimmer-text {
            background: linear-gradient(90deg, #d4af37 0%, #ffffff 50%, #d4af37 100%);
            background-size: 200% auto;
            color: #000;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 5s linear infinite;
        }

        @keyframes shine {
            to { background-position: 200% center; }
        }

        /* ==========================================================================
           2. SPLASH SCREEN (TELA DE ENTRADA)
           ========================================================================== */
        .splash-screen {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 60px 24px 50px 24px;
            background: radial-gradient(circle at center, #2e040e 0%, #0c0103 100%);
            transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.8s, transform 0.8s;
        }

        .splash-screen.fade-out {
            opacity: 0;
            visibility: hidden;
            transform: scale(1.05);
        }

        .splash-top-icon {
            color: var(--gold-primary);
            opacity: 0.85;
            margin-top: 20px;
            filter: drop-shadow(0 0 10px rgba(212, 175, 55, 0.4));
        }

        .splash-title {
            font-family: 'Cinzel', serif;
            font-size: 1.8rem;
            font-weight: 600;
            letter-spacing: 2px;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            margin-top: 10px;
            line-height: 1.4;
        }

        .btn-start {
            width: 145px;
            height: 145px;
            border-radius: 50%;
            background: radial-gradient(circle, #450817 0%, #1c0208 100%);
            border: 2px solid var(--gold-primary);
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.35), inset 0 0 15px rgba(0, 0, 0, 0.8);
            color: var(--gold-light);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
        }

        .btn-start::before {
            content: '';
            position: absolute;
            inset: -8px;
            border-radius: 50%;
            border: 1px solid rgba(212, 175, 55, 0.3);
            animation: ringPulse 2.2s infinite;
        }

        @keyframes ringPulse {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.18); opacity: 0; }
        }

        .btn-start:active { transform: scale(0.93); }

        .btn-start-text {
            font-family: 'Cinzel', serif;
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            color: var(--gold-light);
        }

        .splash-footer {
            text-align: center;
            font-size: 0.8rem;
            color: rgba(248, 226, 154, 0.6);
            letter-spacing: 0.5px;
            font-weight: 300;
        }

        /* ==========================================================================
           3. INTERFACE PRINCIPAL DO PLAYER
           ========================================================================== */
        .app-container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 420px;
            padding: 24px 20px 40px 20px;
            display: flex;
            flex-direction: column;
            gap: 22px;
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 1s ease 0.2s, transform 1s ease 0.2s;
        }

        .app-container.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* Moldura Dupla da Foto */
        .album-art-wrapper {
            position: relative;
            width: 250px;
            height: 250px;
            margin: 10px auto 0 auto;
        }

        .album-frame-back {
            position: absolute;
            inset: -8px;
            border-radius: 26px;
            background: rgba(82, 9, 28, 0.35);
            border: 1px solid rgba(212, 175, 55, 0.25);
            backdrop-filter: blur(10px);
            transform: rotate(-3deg);
        }

        .album-art-container {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 22px;
            overflow: hidden;
            border: 1.5px solid rgba(212, 175, 55, 0.5);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), 0 0 25px rgba(82, 9, 28, 0.6);
            cursor: pointer;
        }

        .album-art {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s ease;
        }

        .album-art-container.playing .album-art {
            animation: breatheArt 4s ease-in-out infinite alternate;
        }

        @keyframes breatheArt {
            0% { transform: scale(1); }
            100% { transform: scale(1.04); }
        }

        /* Equalizador Frequencial */
        .equalizer-bars {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 4px;
            height: 18px;
            margin-top: -6px;
        }

        .equalizer-bars .bar {
            width: 3px;
            height: 4px;
            background: var(--gold-primary);
            border-radius: 2px;
            transition: height 0.3s ease;
        }

        .equalizer-bars.playing .bar {
            animation: barDance 0.8s ease-in-out infinite alternate;
        }

        .equalizer-bars.playing .bar:nth-child(1) { animation-delay: 0.1s; }
        .equalizer-bars.playing .bar:nth-child(2) { animation-delay: 0.35s; }
        .equalizer-bars.playing .bar:nth-child(3) { animation-delay: 0.2s; }
        .equalizer-bars.playing .bar:nth-child(4) { animation-delay: 0.5s; }
        .equalizer-bars.playing .bar:nth-child(5) { animation-delay: 0.25s; }

        @keyframes barDance {
            0% { height: 4px; opacity: 0.4; }
            100% { height: 18px; opacity: 1; box-shadow: 0 0 8px var(--gold-primary); }
        }

        /* Detalhes da Música */
        .track-info {
            text-align: center;
        }

        .track-title {
            font-family: 'Cinzel', serif;
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .track-subtitle {
            font-size: 0.82rem;
            color: rgba(248, 226, 154, 0.7);
            margin-top: 4px;
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        /* Controles de Áudio */
        .audio-controls {
            display: flex;
            flex-direction: column;
            gap: 14px;
            padding: 0 4px;
        }

        .progress-wrapper {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .progress-bar {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 4px;
            border-radius: 2px;
            background: rgba(212, 175, 55, 0.2);
            outline: none;
            cursor: pointer;
            overflow: hidden;
        }

        .progress-bar::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 10px; height: 10px;
            border-radius: 50%;
            background: var(--gold-primary);
            box-shadow: -400px 0 0 395px var(--gold-primary);
        }

        .time-stamps {
            display: flex;
            justify-content: space-between;
            font-size: 0.72rem;
            color: rgba(248, 226, 154, 0.65);
            font-weight: 500;
        }

        .buttons-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 10px;
        }

        .control-btn {
            background: none;
            border: none;
            color: var(--gold-light);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s ease;
            opacity: 0.85;
        }

        .control-btn:active {
            transform: scale(0.86);
            opacity: 1;
        }

        .control-btn.active-repeat {
            color: #ffffff;
            filter: drop-shadow(0 0 6px var(--gold-primary));
        }

        .btn-play-main {
            width: 58px;
            height: 58px;
            border-radius: 50%;
            background: radial-gradient(circle, #480718 0%, #1c0208 100%);
            border: 2px solid var(--gold-primary);
            color: var(--gold-primary);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.35);
            opacity: 1;
        }

        .btn-like svg {
            width: 22px; height: 22px;
            fill: none;
            stroke: var(--gold-light);
            stroke-width: 2;
            transition: all 0.3s ease;
        }

        .btn-like.liked svg {
            fill: var(--gold-primary);
            stroke: var(--gold-primary);
            transform: scale(1.15);
            filter: drop-shadow(0 0 8px rgba(212, 175, 55, 0.6));
        }

        /* Controle Deslizante de Volume */
        .volume-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 0 35px;
        }

        .volume-icon {
            color: rgba(248, 226, 154, 0.6);
            display: flex;
            align-items: center;
        }

        .volume-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 3px;
            border-radius: 2px;
            background: rgba(212, 175, 55, 0.2);
            outline: none;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 10px; height: 10px;
            border-radius: 50%;
            background: var(--gold-primary);
            cursor: pointer;
        }

        /* ==========================================================================
           4. SEÇÃO DE LETRAS SINCRONIZADAS
           ========================================================================== */
        .lyrics-section {
            background: var(--glass-wine);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 20px;
            padding: 18px 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        }

        .lyrics-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-family: 'Cinzel', serif;
            font-size: 0.82rem;
            letter-spacing: 1.5px;
            color: var(--gold-light);
            margin-bottom: 14px;
            text-transform: uppercase;
        }

        .lyrics-container {
            max-height: 130px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            text-align: center;
            padding: 0 6px;
            scroll-behavior: smooth;
        }

        .lyrics-container::-webkit-scrollbar { display: none; }

        .lyric-line {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.05rem;
            color: rgba(248, 226, 154, 0.45);
            transition: all 0.35s ease;
            font-style: italic;
            cursor: pointer;
            padding: 2px 0;
        }

        .lyric-line:hover { color: rgba(255, 255, 255, 0.85); }

        .lyric-line.active {
            color: #ffffff;
            font-size: 1.2rem;
            font-weight: 600;
            font-style: normal;
            text-shadow: 0 0 12px rgba(212, 175, 55, 0.7);
            transform: scale(1.02);
        }

        /* ==========================================================================
           5. CONTADOR DE RELACIONAMENTO (PÍLULA GLASS)
           ========================================================================== */
        .counter-pill {
            background: var(--glass-wine);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 35px;
            padding: 14px 18px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .counter-header {
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: 'Cinzel', serif;
            font-size: 0.78rem;
            color: var(--gold-light);
            letter-spacing: 1px;
        }

        .counter-highlight {
            color: #ffffff;
            font-weight: 700;
            font-size: 0.85rem;
            text-shadow: 0 0 8px rgba(212, 175, 55, 0.5);
            letter-spacing: 0.5px;
        }

        .counter-subtime {
            font-size: 0.72rem;
            color: rgba(248, 226, 154, 0.65);
            font-weight: 300;
        }

        /* Partícula SVG ao curtir */
        .heart-burst-particle {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            animation: burstAnimation 1s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
        }

        @keyframes burstAnimation {
            0% { opacity: 1; transform: translate(-50%, -50%) scale(0.3); }
            100% { opacity: 0; transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(1.3); }
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- Canvas de Fundo -->
    <canvas id="bg-canvas"></canvas>

    <!-- Fundo Iluminado Ambiente -->
    <div class="ambient-bg"></div>

    <!-- Áudio HTML5 -->
    <audio id="audio-player" preload="metadata"></audio>

    <!-- 1. TELA DE ENTRADA / SPLASH SCREEN -->
    <div id="splash-screen" class="splash-screen">
        <div class="splash-top-icon">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 18V5l12-2v13"></path>
                <circle cx="6" cy="18" r="3"></circle>
                <circle cx="18" cy="16" r="3"></circle>
            </svg>
        </div>

        <h1 class="splash-title">Uma surpresa<br>para você...</h1>

        <button id="btn-start" class="btn-start">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" style="margin-left: 3px;">
                <path d="M8 5v14l11-7z"/>
            </svg>
            <span class="btn-start-text">APERTE O PLAY</span>
        </button>

        <div class="splash-footer">
            Sua história começa aqui.<br>Toque para entrar.
        </div>
    </div>

    <!-- 2. INTERFACE PRINCIPAL DO PLAYER -->
    <main id="app-container" class="app-container">

        <!-- Capa da Foto -->
        <div class="album-art-wrapper">
            <div class="album-frame-back"></div>
            <div id="album-container" class="album-art-container" title="Toque duas vezes para curtir">
                <img id="album-art" src="" alt="Foto do Casal" class="album-art">
            </div>
        </div>

        <!-- Equalizador Frequencial -->
        <div id="equalizer" class="equalizer-bars">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </div>

        <!-- Informações da Música -->
        <div class="track-info">
            <h2 class="track-title shimmer-text">Na Hora Que Você Me Chamar</h2>
            <p class="track-subtitle">Jorge & Mateus • Você & Eu</p>
        </div>

        <!-- Controles de Áudio -->
        <div class="audio-controls">
            <div class="progress-wrapper">
                <input type="range" id="progress-bar" class="progress-bar" min="0" max="100" value="0">
                <div class="time-stamps">
                    <span id="current-time">00:00</span>
                    <span id="duration-time">00:00</span>
                </div>
            </div>

            <div class="buttons-row">
                <!-- Repetir -->
                <button id="btn-repeat" class="control-btn" aria-label="Repetir">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="17 1 21 5 17 9"></polyline>
                        <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
                        <polyline points="7 23 3 19 7 15"></polyline>
                        <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
                    </svg>
                </button>

                <!-- Anterior -->
                <button id="btn-prev" class="control-btn" aria-label="Voltar">
                    <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                        <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/>
                    </svg>
                </button>

                <!-- Play/Pause -->
                <button id="btn-toggle-play" class="control-btn btn-play-main" aria-label="Tocar/Pausar">
                    <svg id="icon-play" viewBox="0 0 24 24" width="28" height="28" fill="currentColor">
                        <path d="M8 5v14l11-7z"/>
                    </svg>
                    <svg id="icon-pause" class="hidden" viewBox="0 0 24 24" width="28" height="28" fill="currentColor">
                        <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                    </svg>
                </button>

                <!-- Próximo -->
                <button id="btn-next" class="control-btn" aria-label="Avançar">
                    <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                        <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
                    </svg>
                </button>

                <!-- Curtir -->
                <button id="btn-like" class="control-btn btn-like" aria-label="Curtir">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                    </svg>
                </button>
            </div>

            <!-- Volume -->
            <div class="volume-container">
                <span class="volume-icon">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                    </svg>
                </span>
                <input type="range" id="volume-slider" class="volume-slider" min="0" max="1" step="0.05" value="1">
                <span class="volume-icon">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                        <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                    </svg>
                </span>
            </div>
        </div>

        <!-- 3. LETRAS SINCRONIZADAS -->
        <div class="lyrics-section">
            <div class="lyrics-header">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 18V5l12-2v13"></path>
                    <circle cx="6" cy="18" r="3"></circle>
                    <circle cx="18" cy="16" r="3"></circle>
                </svg>
                <span>Letras Sincronizadas</span>
            </div>
            <div id="lyrics-container" class="lyrics-container">
                <!-- Gerado via JS -->
            </div>
        </div>

        <!-- 4. CONTADOR DE RELACIONAMENTO -->
        <div class="counter-pill">
            <div class="counter-header">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <polyline points="12 6 12 12 16 14"></polyline>
                </svg>
                <span>JUNTOS HÁ</span>
            </div>
            <div class="counter-highlight" id="counter-main">0 ANOS • 0 MESES • 0 DIAS</div>
            <div id="counter-sub" class="counter-subtime">00 HORAS • 00 MIN • 00 SEG</div>
        </div>

    </main>

    <!-- ==========================================================================
       LÓGICA JAVASCRIPT REFINADA
       ========================================================================== -->
    <script>
        /* ==========================================================================
           CONFIGURAÇÕES PERSONALIZADAS
           ========================================================================== */

        // 1. Cole a URL da FOTO DO CASAL aqui:
        const COUPLE_PHOTO_URL = "https://images.unsplash.com/photo-1518199266791-5375a83190b7?q=80&w=800&auto=format&fit=crop";

        // 2. Cole a URL do ÁUDIO MP3 aqui:
        const AUDIO_URL = "https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=lofi-study-112191.mp3";

        // 3. Data de início do namoro: 01/09/2023 (Setembro = mês 8 em JS)
        const RELATIONSHIP_START_DATE = new Date(2023, 8, 1, 0, 0, 0);

        // 4. Letras limpas e sincronizadas "Na hora que você me chamar":
        const LYRICS = [
            { time: 0, text: "Se não sou eu, quem vai ser?" },
            { time: 5, text: "Aconteça o que acontecer..." },
            { time: 10, text: "Eu não desisto de você jamais" },
            { time: 16, text: "Tanto faz se o mundo desabar..." },
            { time: 22, text: "Se for bom, um dia vai voltar... voltar pra mim" },
            { time: 29, text: "Eu tenho um dicionário de defeitos" },
            { time: 34, text: "Desculpe, amor, esse é meu jeito... esse é o jeito meu" },
            { time: 41, text: "Sem pensar, me deixou aqui..." },
            { time: 46, text: "Pra pensar no que te faz feliz, te faz sorrir" },
            { time: 54, text: "Se não sou eu, quem vai ser?" },
            { time: 59, text: "Se não sou eu, quem vai ser?" },
            { time: 65, text: "E se você quiser, espero por você" },
            { time: 70, text: "E se você ligar, eu corro pra atender" },
            { time: 76, text: "À meia-noite ou quatro horas da manhã..." },
            { time: 82, text: "Eu vou te encontrar..." },
            { time: 87, text: "Na hora em que você me chamar" }
        ];

        /* ==========================================================================
           CONTROLE DE INTERATIVIDADE E ÁUDIO
           ========================================================================== */

        const splashScreen = document.getElementById('splash-screen');
        const btnStart = document.getElementById('btn-start');
        const appContainer = document.getElementById('app-container');
        const audioPlayer = document.getElementById('audio-player');
        const albumArt = document.getElementById('album-art');
        const albumContainer = document.getElementById('album-container');
        const equalizer = document.getElementById('equalizer');

        const btnTogglePlay = document.getElementById('btn-toggle-play');
        const iconPlay = document.getElementById('icon-play');
        const iconPause = document.getElementById('icon-pause');
        const progressBar = document.getElementById('progress-bar');
        const currentTimeEl = document.getElementById('current-time');
        const durationTimeEl = document.getElementById('duration-time');
        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');
        const btnRepeat = document.getElementById('btn-repeat');
        const btnLike = document.getElementById('btn-like');
        const volumeSlider = document.getElementById('volume-slider');
        const lyricsContainer = document.getElementById('lyrics-container');

        albumArt.src = COUPLE_PHOTO_URL;
        audioPlayer.src = AUDIO_URL;

        // Renderiza as Letras Interativas (Click-to-Seek)
        LYRICS.forEach((lyric) => {
            const p = document.createElement('p');
            p.classList.add('lyric-line');
            p.textContent = lyric.text;
            p.addEventListener('click', () => {
                audioPlayer.currentTime = lyric.time;
                if (audioPlayer.paused) {
                    audioPlayer.play();
                    updatePlayState(true);
                }
            });
            lyricsContainer.appendChild(p);
        });

        // Clique no Botão Principal
        btnStart.addEventListener('click', () => {
            audioPlayer.play().then(() => {
                updatePlayState(true);
            }).catch(err => console.log("Aguardando ação...", err));

            splashScreen.classList.add('fade-out');
            appContainer.classList.add('show');
        });

        function updatePlayState(isPlaying) {
            if (isPlaying) {
                iconPlay.classList.add('hidden');
                iconPause.classList.remove('hidden');
                albumContainer.classList.add('playing');
                equalizer.classList.add('playing');
            } else {
                iconPlay.classList.remove('hidden');
                iconPause.classList.add('hidden');
                albumContainer.classList.remove('playing');
                equalizer.classList.remove('playing');
            }
        }

        btnTogglePlay.addEventListener('click', () => {
            if (audioPlayer.paused) {
                audioPlayer.play();
                updatePlayState(true);
            } else {
                audioPlayer.pause();
                updatePlayState(false);
            }
        });

        // Atualizador de Progresso
        audioPlayer.addEventListener('timeupdate', () => {
            if (!audioPlayer.duration) return;
            const progress = (audioPlayer.currentTime / audioPlayer.duration) * 100;
            progressBar.value = progress;

            currentTimeEl.textContent = formatTime(audioPlayer.currentTime);
            durationTimeEl.textContent = formatTime(audioPlayer.duration);

            syncLyrics(audioPlayer.currentTime);
        });

        progressBar.addEventListener('input', () => {
            audioPlayer.currentTime = (progressBar.value / 100) * audioPlayer.duration;
        });

        // Volume
        volumeSlider.addEventListener('input', (e) => {
            audioPlayer.volume = e.target.value;
        });

        // Repetir
        btnRepeat.addEventListener('click', () => {
            audioPlayer.loop = !audioPlayer.loop;
            btnRepeat.classList.toggle('active-repeat', audioPlayer.loop);
        });

        btnPrev.addEventListener('click', () => { audioPlayer.currentTime = Math.max(0, audioPlayer.currentTime - 5); });
        btnNext.addEventListener('click', () => { audioPlayer.currentTime = Math.min(audioPlayer.duration, audioPlayer.currentTime + 5); });

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        // Sincronizador de Letras
        function syncLyrics(currentTime) {
            const lines = document.querySelectorAll('.lyric-line');
            let activeIndex = -1;

            for (let i = 0; i < LYRICS.length; i++) {
                if (currentTime >= LYRICS[i].time) activeIndex = i;
            }

            lines.forEach((line, idx) => {
                if (idx === activeIndex) {
                    if (!line.classList.contains('active')) {
                        line.classList.add('active');
                        line.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                } else {
                    line.classList.remove('active');
                }
            });
        }

        // Toque Duplo para Curtir
        let lastTap = 0;
        albumContainer.addEventListener('click', (e) => {
            const currentTime = new Date().getTime();
            const tapLength = currentTime - lastTap;
            if (tapLength < 350 && tapLength > 0) {
                btnLike.classList.add('liked');
                createHeartExplosion(e);
            }
            lastTap = currentTime;
        });

        btnLike.addEventListener('click', (e) => {
            btnLike.classList.toggle('liked');
            createHeartExplosion(e);
        });

        // Partículas SVG de Coração ao Curtir
        function createHeartExplosion(e) {
            const x = e.clientX || window.innerWidth / 2;
            const y = e.clientY || window.innerHeight / 2;

            for (let i = 0; i < 14; i++) {
                const heart = document.createElement('div');
                heart.classList.add('heart-burst-particle');
                heart.innerHTML = `<svg viewBox="0 0 24 24" fill="#d4af37" width="18" height="18"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>`;
                document.body.appendChild(heart);

                const angle = (i / 14) * Math.PI * 2;
                const velocity = 45 + Math.random() * 55;
                const tx = Math.cos(angle) * velocity;
                const ty = Math.sin(angle) * velocity - 20;

                heart.style.left = `${x}px`;
                heart.style.top = `${y}px`;
                heart.style.setProperty('--tx', `${tx}px`);
                heart.style.setProperty('--ty', `${ty}px`);

                setTimeout(() => heart.remove(), 1000);
            }
        }

        // Contador de Relacionamento Preciso
        function updateCounter() {
            const now = new Date();
            let years = now.getFullYear() - RELATIONSHIP_START_DATE.getFullYear();
            let months = now.getMonth() - RELATIONSHIP_START_DATE.getMonth();
            let days = now.getDate() - RELATIONSHIP_START_DATE.getDate();
            let hours = now.getHours() - RELATIONSHIP_START_DATE.getHours();
            let minutes = now.getMinutes() - RELATIONSHIP_START_DATE.getMinutes();
            let seconds = now.getSeconds() - RELATIONSHIP_START_DATE.getSeconds();

            if (seconds < 0) { seconds += 60; minutes--; }
            if (minutes < 0) { minutes += 60; hours--; }
            if (hours < 0) { hours += 24; days--; }
            if (days < 0) {
                const prevMonth = new Date(now.getFullYear(), now.getMonth(), 0);
                days += prevMonth.getDate();
                months--;
            }
            if (months < 0) { months += 12; years--; }

            document.getElementById('counter-main').textContent = 
                `${years} ANOS • ${months} MESES • ${days} DIAS`;
            
            document.getElementById('counter-sub').textContent = 
                `${hours < 10 ? '0' + hours : hours} HORAS • ${minutes < 10 ? '0' + minutes : minutes} MIN • ${seconds < 10 ? '0' + seconds : seconds} SEG`;
        }

        setInterval(updateCounter, 1000);
        updateCounter();

        // Canvas de Corações Vetoriais
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let width, height, particles = [];

        function resizeCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class VectorParticle {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * width;
                this.y = height + 20;
                this.size = Math.random() * 7 + 4;
                this.speedY = Math.random() * 0.7 + 0.3;
                this.opacity = Math.random() * 0.35 + 0.1;
                this.color = Math.random() > 0.4 ? '#d4af37' : '#52091c';
            }
            update() {
                this.y -= this.speedY;
                this.x += Math.sin(this.y * 0.005) * 0.4;
                if (this.y < -20) this.reset();
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.opacity;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                const x = this.x, y = this.y, s = this.size;
                ctx.moveTo(x, y);
                ctx.bezierCurveTo(x - s/2, y - s/2, x - s, y + s/3, x, y + s);
                ctx.bezierCurveTo(x + s, y + s/3, x + s/2, y - s/2, x, y);
                ctx.fill();
                ctx.restore();
            }
        }

        for (let i = 0; i < 22; i++) particles.push(new VectorParticle());

        function animateCanvas() {
            ctx.clearRect(0, 0, width, height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animateCanvas);
        }
        animateCanvas();
    </script>
</body>
</html>
